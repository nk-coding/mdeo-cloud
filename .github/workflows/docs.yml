name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "app/packages/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "app/packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it, so main and the live site cannot drift apart.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            website/package-lock.json

      # The sample validator loads the built language packages, so the app
      # packages have to be compiled before the docs can be built.
      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build language packages
        working-directory: app
        run: npm run build:packages

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Validate documentation samples
        working-directory: website
        run: npm run validate

      # Publish for the repository this runs in (e.g. nk-coding/mdeo-cloud-private), not for the
      # upstream organisation: Pages serves the site under /<repository name>/.
      - name: Build site
        working-directory: website
        env:
          DOCS_REPOSITORY: https://github.com/${{ github.repository }}
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npx vitepress build docs

      # Publishing to GitHub Pages is disabled for now (see the deploy job); the site is still built
      # and its samples validated as a check.
      - uses: actions/configure-pages@v6
        if: ${{ false }}

      - uses: actions/upload-pages-artifact@v5
        if: ${{ false }}
        with:
          path: website/docs/.vitepress/dist

  deploy:
    # Disabled for now: this copy (nk-coding/mdeo-cloud-private) only publishes the container images
    # (docker-publish.yml). Restore `github.event_name != 'pull_request'` to publish the docs again.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
