name: Release npm Packages

# The file name of this workflow is part of the npm trusted publisher configuration of every
# package. Renaming it breaks publishing until the trust configuration is updated, see
# app/RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish with --dry-run instead of publishing"
        type: boolean
        default: true

# id-token is what lets npm authenticate this workflow via OIDC (trusted publishing), so no npm
# token is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    # Disabled for now: this copy (nk-coding/mdeo-cloud-private) only publishes the container images
    # (docker-publish.yml). Remove the condition to publish the npm packages again.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Trusted publishing needs npm >= 11.5.1, which is newer than what the Node release bundles.
      - name: Update npm
        run: npm install -g npm@latest

      # The packages share the version of the release, so a tag that disagrees with the manifests
      # would publish something other than what the release points at. Prereleases go to a dist-tag
      # named after their prerelease identifier, so `npm install @mdeo/...` keeps resolving to the
      # latest stable release.
      - name: Determine version and dist-tag
        id: version
        working-directory: app
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "${{ github.event_name }}" == "release" && "$TAG" != "v$version" ]]; then
            echo "release tag $TAG does not match package version $version" >&2
            echo "run 'npm run set-version -- ${TAG#v}' and commit the result" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            tag="${prerelease%%.*}"
          else
            tag=latest
          fi
          echo "publishing $version with dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Guarantees every package is at the version verified above, and that the ranges they use for
      # each other point at it.
      - name: Verify package versions are in sync
        working-directory: app
        run: npm run lint:versions

      - name: Build packages
        working-directory: app
        run: npm run build:packages

      - name: Build stylesheets
        working-directory: app
        run: npm run build:css

      # Publishes every workspace that is not marked private.
      - name: Publish packages
        working-directory: app
        run: >-
          npm publish --workspaces --provenance --tag ${{ steps.version.outputs.tag }}
          ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
